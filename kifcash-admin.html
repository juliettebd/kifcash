<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kif'Cash — Admin</title>
<style>
  :root{
    --kc-navy:#123859;
    --kc-violet:#8D1E81;
    --kc-rose:#E60F72;
    --kc-mist:#F5F5F2;
    --kc-line: rgba(18,56,89,0.15);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:var(--kc-mist);
    color:var(--kc-navy);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    background:#FFFFFF;
    border-bottom:1px solid var(--kc-line);
  }
  header .kc-brand{ font-weight:700; font-size:1rem; }
  header button{
    background:none; border:1px solid var(--kc-line); border-radius:6px;
    padding:7px 14px; font-size:0.85rem; cursor:pointer; color:var(--kc-navy);
  }
  main{ padding:28px 24px; max-width:1000px; margin:0 auto; }

  /* login */
  .kc-login{
    max-width:340px; margin:80px auto; background:#fff; border:1px solid var(--kc-line);
    border-radius:8px; padding:28px;
  }
  .kc-login h1{ font-size:1.1rem; margin:0 0 18px; }
  .kc-login label{ display:block; font-size:0.82rem; font-weight:600; margin:12px 0 5px; }
  .kc-login input{
    width:100%; padding:10px 12px; border:1px solid var(--kc-line); border-radius:6px; font-size:0.95rem;
  }
  .kc-login button{
    margin-top:18px; width:100%; padding:11px; border:none; border-radius:6px;
    background:var(--kc-navy); color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;
  }
  .kc-login-error{ color:var(--kc-rose); font-size:0.82rem; margin-top:10px; display:none; }

  /* toolbar */
  .kc-toolbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  .kc-count{ font-size:0.85rem; color:rgba(18,56,89,0.65); }
  .kc-count strong{ color:var(--kc-navy); font-size:1.05rem; }
  .kc-actions{ display:flex; gap:8px; }
  .kc-actions button{
    font-size:0.82rem; padding:8px 13px; border:1px solid var(--kc-line); border-radius:6px;
    background:#fff; cursor:pointer; color:var(--kc-navy);
  }
  .kc-actions button:hover{ border-color:var(--kc-navy); }

  /* table */
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--kc-line); border-radius:8px; overflow:hidden; }
  th, td{ text-align:left; padding:10px 12px; font-size:0.85rem; border-bottom:1px solid var(--kc-line); }
  th{ background:var(--kc-mist); font-weight:700; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em; color:rgba(18,56,89,0.7); }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--kc-mist); }
  tbody tr:last-child td{ border-bottom:none; }

  .kc-empty{ padding:40px; text-align:center; color:rgba(18,56,89,0.55); font-size:0.9rem; }
  .kc-loading{ padding:40px; text-align:center; color:rgba(18,56,89,0.55); font-size:0.9rem; }

  /* detail */
  .kc-back{
    background:none; border:none; color:var(--kc-violet); font-size:0.85rem; cursor:pointer;
    padding:0; margin-bottom:16px; font-weight:600;
  }
  .kc-detail-card{ background:#fff; border:1px solid var(--kc-line); border-radius:8px; padding:22px; margin-bottom:20px; }
  .kc-detail-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
  .kc-detail-grid div span{ display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em; color:rgba(18,56,89,0.5); margin-bottom:3px; }
  .kc-detail-grid div strong{ font-size:0.92rem; }

  .kc-ranking-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--kc-line); font-size:0.88rem; }
  .kc-ranking-row:last-child{ border-bottom:none; }
  .kc-ranking-row .rank{ font-weight:700; color:rgba(18,56,89,0.4); width:22px; }
  .kc-ranking-row .name{ flex:1; }
  .kc-ranking-row .score{ font-weight:700; }

  h2.kc-section-title{ font-size:0.95rem; margin:26px 0 10px; }
</style>
</head>

  // ============================================================
  // UTILITAIRES DOM
  // ============================================================

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs){
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function(child){ if (child) node.appendChild(child); });
    return node;
  }

  function formatDate(value){
    var d = (value && typeof value.toDate === "function") ? value.toDate() : new Date(value);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("fr-BE") + " " + d.toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
  }

  function csvEscape(value){
    var str = (value === null || value === undefined) ? "" : String(value);
    if (/[",\n]/.test(str)) str = '"' + str.replace(/"/g, '""') + '"';
    return str;
  }

  function downloadCsv(filename, rows){
    var content = rows.map(function(row){ return row.map(csvEscape).join(","); }).join("\r\n");
    var blob = new Blob(["\uFEFF" + content], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // ============================================================
  // AUTHENTIFICATION
  // ============================================================

  document.getElementById("kc-logout-btn").addEventListener("click", function(){
    signOut(auth);
  });

  onAuthStateChanged(auth, function(user){
    if (!user){
      document.getElementById("kc-logout-btn").hidden = true;
      state.view = "login";
      render();
      return;
    }

    getDoc(doc(db, "admins", user.uid)).then(function(adminDoc){
      if (!adminDoc.exists()){
        signOut(auth);
        state.view = "login";
        state.loginError = "Ce compte n'a pas les droits admin.";
        render();
        return;
      }
      document.getElementById("kc-logout-btn").hidden = false;
      loadTests();
    }).catch(function(err){
      console.error(err);
      signOut(auth);
      state.view = "login";
      state.loginError = "Erreur de vérification des droits admin.";
      render();
    });
  });

  // ============================================================
  // CHARGEMENT DES DONNÉES (jointure tests + participants)
  // ============================================================

  function loadTests(){
    state.view = "loading";
    render();

    Promise.all([
      getDocs(query(collection(db, "tests"), orderBy("createdAt", "desc"))),
      getDocs(collection(db, "participants"))
    ]).then(function(results){
      var testsSnap = results[0];
      var participantsSnap = results[1];

      var participantsById = {};
      participantsSnap.forEach(function(docSnap){
        participantsById[docSnap.id] = docSnap.data();
      });

      state.joinedTests = [];
      testsSnap.forEach(function(docSnap){
        var testData = docSnap.data();
        var participant = participantsById[testData.participantId] || {};
        state.joinedTests.push({
          testId: docSnap.id,
          participantId: testData.participantId,
          testVersion: testData.testVersion,
          createdAt: testData.createdAt,
          scores: testData.scores,
          ranking: testData.ranking,
          dominant: testData.dominant,
          secondaire: testData.secondaire,
          responses: testData.responses,
          prenom: participant.prenom || "—",
          email: participant.email || "—",
          pays: participant.pays || "—"
        });
      });

      state.view = "list";
      render();
    }).catch(function(err){
      console.error(err);
      state.view = "list";
      state.joinedTests = [];
      render();
    });
  }

  // ============================================================
  // ÉCRAN — LOGIN
  // ============================================================

  function renderLogin(){
    var main = document.getElementById("kc-main");
    main.innerHTML = "";

    var box = el("div", { class: "kc-login" });
    box.appendChild(el("h1", {}, [document.createTextNode("Connexion admin")]));

    var emailInput = el("input", { type: "email", id: "kc-login-email", autocomplete: "username" });
    var passInput = el("input", { type: "password", id: "kc-login-password", autocomplete: "current-password" });

    box.appendChild(el("label", { for: "kc-login-email" }, [document.createTextNode("Email")]));
    box.appendChild(emailInput);
    box.appendChild(el("label", { for: "kc-login-password" }, [document.createTextNode("Mot de passe")]));
    box.appendChild(passInput);

    var errorEl = el("div", { class: "kc-login-error", id: "kc-login-error" }, [document.createTextNode(state.loginError || "")]);
    if (state.loginError) errorEl.style.display = "block";
    box.appendChild(errorEl);

    var submitBtn = el("button", { type: "button" }, [document.createTextNode("Se connecter")]);
    submitBtn.addEventListener("click", function(){
      state.loginError = "";
      signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value)
        .catch(function(err){
          state.loginError = "Identifiants incorrects.";
          console.error(err);
          render();
        });
    });
    box.appendChild(submitBtn);

    main.appendChild(box);
  }

  // ============================================================
  // ÉCRAN — LISTE DES TESTS
  // ============================================================

    var main = document.getElementById("kc-main");

    var toolbar = el("div", { class: "kc-toolbar" });
    toolbar.appendChild(el("div", { class: "kc-count" }, [
      el("strong", {}, [document.createTextNode(String(state.joinedTests.length))]),
      document.createTextNode(" test(s) au total")
    ]));

    var actions = el("div", { class: "kc-actions" });
    var exportTestsBtn = el("button", {}, [document.createTextNode("Export Tests (CSV)")]);
    exportTestsBtn.addEventListener("click", exportTestsCsv);
    var exportResponsesBtn = el("button", {}, [document.createTextNode("Export Réponses (CSV)")]);
    exportResponsesBtn.addEventListener("click", exportResponsesCsv);
    actions.appendChild(exportTestsBtn);
    actions.appendChild(exportResponsesBtn);
    toolbar.appendChild(actions);

    main.appendChild(toolbar);

    if (!state.joinedTests.length){
      main.appendChild(el("div", { class: "kc-empty" }, [document.createTextNode("Aucun test enregistré pour l'instant.")]));
      return;
    }

    var table = el("table");
    var thead = el("thead", {}, [el("tr", {}, [
      el("th", {}, [document.createTextNode("Date")]),
      el("th", {}, [document.createTextNode("Prénom")]),
      el("th", {}, [document.createTextNode("Email")]),
      el("th", {}, [document.createTextNode("Pays")]),
      el("th", {}, [document.createTextNode("Saboteur dominant")]),
      el("th", {}, [document.createTextNode("Score")])
    ])]);
    table.appendChild(thead);

    var tbody = el("tbody");
    state.joinedTests.forEach(function(t){
      var row = el("tr", {}, [
        el("td", {}, [document.createTextNode(formatDate(t.createdAt))]),
        el("td", {}, [document.createTextNode(t.prenom)]),
        el("td", {}, [document.createTextNode(t.email)]),
        el("td", {}, [document.createTextNode(t.pays)]),
        el("td", {}, [document.createTextNode(t.dominant ? t.dominant.name : "—")]),
        el("td", {}, [document.createTextNode(t.dominant ? String(t.dominant.score) : "—")])
      ]);
      row.addEventListener("click", function(){
        state.selectedTest = t;
        state.view = "detail";
        render();
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    main.appendChild(table);
  }

  // ============================================================
  // ÉCRAN — DÉTAIL D'UN TEST
  // ============================================================

  function renderDetail(){
    var main = document.getElementById("kc-main");
    main.innerHTML = "";

    var t = state.selectedTest;

    var backBtn = el("button", { class: "kc-back" }, [document.createTextNode("← Retour à la liste")]);
    backBtn.addEventListener("click", function(){
      state.view = "list";
      render();
    });
    main.appendChild(backBtn);

    var infoCard = el("div", { class: "kc-detail-card" });
    var grid = el("div", { class: "kc-detail-grid" }, [
      detailField("Prénom", t.prenom),
      detailField("Email", t.email),
      detailField("Pays", t.pays),
      detailField("Date", formatDate(t.createdAt)),
      detailField("Version du test", t.testVersion)
    ]);
    infoCard.appendChild(grid);
    main.appendChild(infoCard);

    main.appendChild(el("h2", { class: "kc-section-title" }, [document.createTextNode("Classement")]));
    var rankingCard = el("div", { class: "kc-detail-card" });
    (t.ranking || []).forEach(function(item, index){
      rankingCard.appendChild(el("div", { class: "kc-ranking-row" }, [
        el("span", { class: "rank" }, [document.createTextNode("#" + (index + 1))]),
        el("span", { class: "name" }, [document.createTextNode(item.name)]),
        el("span", { class: "score" }, [document.createTextNode(String(item.score))])
      ]));
    });
    main.appendChild(rankingCard);

    main.appendChild(el("h2", { class: "kc-section-title" }, [document.createTextNode("Les 60 réponses")]));
    var table = el("table");
    var thead = el("thead", {}, [el("tr", {}, [
      el("th", {}, [document.createTextNode("ID")]),
      el("th", {}, [document.createTextNode("Saboteur")]),
      el("th", {}, [document.createTextNode("Facette")]),
      el("th", {}, [document.createTextNode("Affirmation")]),
      el("th", {}, [document.createTextNode("Réponse")])
    ])]);
    table.appendChild(thead);

    var tbody = el("tbody");
    (t.responses || []).slice().sort(function(a, b){ return a.questionId - b.questionId; }).forEach(function(r){
      var q = QUESTIONS_BY_ID[r.questionId] || {};
      tbody.appendChild(el("tr", {}, [
        el("td", {}, [document.createTextNode(String(r.questionId))]),
        el("td", {}, [document.createTextNode(r.saboteur)]),
        el("td", {}, [document.createTextNode(r.facette)]),
        el("td", {}, [document.createTextNode(q.text || "—")]),
        el("td", {}, [document.createTextNode(String(r.answer))])
      ]));
    });
    table.appendChild(tbody);
    main.appendChild(table);
  }

  function detailField(label, value){
    return el("div", {}, [
      el("span", {}, [document.createTextNode(label)]),
      el("strong", {}, [document.createTextNode(value || "—")])
    ]);
  }

  // ============================================================
  // EXPORTS CSV
  // ============================================================

  function exportTestsCsv(){
    var header = [
      "Date", "Test ID", "Participant ID", "Prénom", "Email", "Pays", "Version",
      "Sauveteuse Altruiste", "Persévérante Insatiable", "Serrurière de Fortune",
      "Rebelle Intègre", "Prospère Saboteuse", "Dominant", "Secondaire"
    ];

    var rows = [header];
    state.joinedTests.forEach(function(t){
      var scores = t.scores || {};
      var row = [
        formatDate(t.createdAt),
        t.testId,
        t.participantId,
        t.prenom,
        t.email,
        t.pays,
        t.testVersion
      ];
      SABOTEUR_ORDER.forEach(function(name){ row.push(scores[name] !== undefined ? scores[name] : ""); });
      row.push(t.dominant ? t.dominant.name : "");
      row.push(t.secondaire ? t.secondaire.name : "");
      rows.push(row);
    });

    downloadCsv("kifcash-tests.csv", rows);
  }

  function exportResponsesCsv(){
    var header = ["Date test", "Test ID", "Participant ID", "Question ID", "Saboteur", "Facette", "Réponse"];
    var rows = [header];

    state.joinedTests.forEach(function(t){
      (t.responses || []).forEach(function(r){
        rows.push([
          formatDate(t.createdAt),
          t.testId,
          t.participantId,
          r.questionId,
          r.saboteur,
          r.facette,
          r.answer
        ]);
      });
    });

    downloadCsv("kifcash-reponses.csv", rows);
  }

  // ============================================================
  // ROUTER
  // ============================================================

  function render(){
    if (state.view === "login") renderLogin();
    else if (state.view === "list") renderList();
    else if (state.view === "detail") renderDetail();
    else {
      document.getElementById("kc-main").innerHTML = '<div class="kc-loading">Chargement…</div>';
    }
  }

  render();
</script>
</body>
</html>
