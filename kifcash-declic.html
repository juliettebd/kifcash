<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Déclic — Kif'Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --kc-violet:#8D1E81;
    --kc-rose:#E60F72;
    --kc-navy:#123859;
    --kc-white:#FFFFFF;
    --kc-mist:#F5F5F2;
    --kc-line: rgba(18,56,89,0.14);
    --kc-line-soft: rgba(18,56,89,0.08);
    --kc-gradient: linear-gradient(90deg, var(--kc-violet), var(--kc-rose));
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--kc-white);
    color:var(--kc-navy);
    font-family:'Roboto', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.kc-display{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }

  .kc-app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- HEADER ---------- */

  .kc-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:22px 28px;
    border-bottom:1px solid var(--kc-line-soft);
  }

  .kc-brand{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.05rem;
    color:var(--kc-navy);
    white-space:nowrap;
  }

  .kc-brand span{
    background:var(--kc-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .kc-progress{ display:flex; align-items:center; gap:12px; flex:1; max-width:340px; }

  .kc-progress-track{
    position:relative; flex:1; height:4px;
    background:var(--kc-line-soft); border-radius:2px; overflow:hidden;
  }

  .kc-progress-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--kc-gradient); transition:width 0.35s ease;
  }

  .kc-progress-count{
    font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.85rem;
    color:var(--kc-navy); white-space:nowrap; font-variant-numeric:tabular-nums;
  }

  /* ---------- MAIN LAYOUT ---------- */

  main{ flex:1; display:flex; justify-content:center; padding:48px 24px 96px; }

  .kcd-screen{ width:100%; max-width:640px; }

  .kcd-eyebrow{
    font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.78rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--kc-rose); margin-bottom:14px;
  }

  .kcd-screen h1{ font-size:2rem; line-height:1.15; margin-bottom:18px; }
  .kcd-screen h2{ font-size:1.4rem; line-height:1.2; margin-bottom:14px; }
  .kcd-screen h3{ font-size:1.05rem; line-height:1.25; margin:22px 0 10px; color:var(--kc-navy); }

  .kcd-screen p{ font-size:1.02rem; line-height:1.65; color:rgba(18,56,89,0.82); margin:0 0 14px; }
  .kcd-screen p strong{ color:var(--kc-navy); }
  .kcd-screen p em{ font-style:italic; color:rgba(18,56,89,0.6); font-size:0.92rem; }

  .kcd-storage-note{
    display:flex; gap:10px; padding:14px 16px; background:var(--kc-mist); border-radius:8px;
    font-size:0.85rem; line-height:1.5; color:rgba(18,56,89,0.75); margin:22px 0 30px;
  }

  .kcd-situation-recall{
    padding:14px 16px; background:var(--kc-mist); border-radius:8px;
    font-size:0.95rem; line-height:1.5; color:var(--kc-navy); margin-bottom:22px;
  }
  .kcd-situation-recall strong{
    display:block; font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--kc-rose); margin-bottom:6px;
  }

  /* ---------- FIELDS ---------- */

  .kcd-field{ margin-bottom:20px; }
  .kcd-field label{
    display:block; font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.88rem;
    margin-bottom:8px; color:var(--kc-navy);
  }
  .kcd-field textarea, .kcd-field input[type="text"], .kcd-field input[type="number"]{
    width:100%; padding:13px 15px; border:1px solid var(--kc-line); border-radius:8px;
    font-family:'Roboto', Arial, sans-serif; font-size:1rem; color:var(--kc-navy);
    background:var(--kc-white); transition:border-color 0.2s ease;
  }
  .kcd-field textarea{ resize:vertical; min-height:64px; font-family:'Roboto', Arial, sans-serif; }
  .kcd-field input:focus, .kcd-field textarea:focus{ outline:none; border-color:var(--kc-violet); }
  .kcd-field-error{ display:none; font-size:0.8rem; color:var(--kc-rose); margin-top:6px; }
  .kcd-field.kcd-invalid textarea, .kcd-field.kcd-invalid input{ border-color:var(--kc-rose); }
  .kcd-field.kcd-invalid .kcd-field-error{ display:block; }

  .kcd-inline-fields{ display:flex; gap:14px; }
  .kcd-inline-fields .kcd-field{ flex:1; margin-bottom:0; }
  .kcd-suffix{ font-size:0.8rem; color:rgba(18,56,89,0.55); margin-top:6px; }

  select.kcd-select{
    width:100%; padding:13px 15px; border:1px solid var(--kc-line); border-radius:8px;
    font-family:'Roboto', Arial, sans-serif; font-size:1rem; color:var(--kc-navy); background:var(--kc-white);
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23123859' d='M5.5 7.5l4.5 4.5 4.5-4.5z'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 14px center;
  }

  /* ---------- CHOICE ITEMS (radio ou checkbox) ---------- */

  .kcd-choice-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .kcd-choice-item{
    display:flex; align-items:center; gap:12px; padding:14px 16px; position:relative;
    border:1px solid var(--kc-line); border-radius:8px; cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .kcd-choice-item:hover{ border-color:var(--kc-violet); }
  .kcd-choice-item.selected{ border-color:var(--kc-violet); background:rgba(141,30,129,0.05); }

  /* Le vrai input reste fonctionnel (cliquable, accessible) mais invisible : */
  /* c'est le pseudo-élément ci-dessous qui dessine le rond/carré, toujours parfaitement centré. */
  .kcd-choice-item input{
    position:absolute; opacity:0; width:0; height:0; margin:0; padding:0; pointer-events:none;
  }
  .kcd-choice-item::before{
    content:"";
    flex-shrink:0;
    width:20px; height:20px;
    box-sizing:border-box;
    border:2px solid var(--kc-line);
    background-color:var(--kc-white);
    background-repeat:no-repeat;
    background-position:center;
    transition:border-color 0.15s ease, background-image 0.15s ease;
  }
  .kcd-choice-radio::before{ border-radius:50%; }
  .kcd-choice-checkbox::before{ border-radius:5px; }
  .kcd-choice-item.selected::before{
    border-color:var(--kc-violet);
    background-image:radial-gradient(circle, var(--kc-violet) 0%, var(--kc-violet) 42%, transparent 46%);
  }

  .kcd-choice-item span{ font-size:0.96rem; line-height:1.4; color:var(--kc-navy); }

  .kcd-conditional-block{
    margin-top:4px; margin-bottom:26px; padding:18px 18px 4px;
    border-left:2px solid var(--kc-line); padding-left:18px;
  }

  /* ---------- BUTTONS ---------- */

  .kc-btn{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.95rem;
    border:none; border-radius:8px; padding:15px 30px; cursor:pointer;
    line-height:1; text-align:center;
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .kc-btn-primary{ background:var(--kc-gradient); color:var(--kc-white); }
  .kc-btn-primary:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 6px 18px rgba(141,30,129,0.28); }
  .kc-btn-primary:disabled{ opacity:0.38; cursor:not-allowed; transform:none; box-shadow:none; }
  .kc-btn-secondary{ background:transparent; color:var(--kc-navy); border:1px solid var(--kc-line); }
  .kc-btn-secondary:hover{ border-color:var(--kc-navy); }
  .kc-btn-text{
    background:none; border:none; color:rgba(18,56,89,0.6); font-family:'Roboto', Arial, sans-serif;
    font-size:0.85rem; text-decoration:underline; cursor:pointer; padding:6px 0;
  }

  /* Espace systématique sous tout bouton autonome (hors ligne de navigation) suivi d'autre contenu */
  .kcd-screen > .kc-btn,
  .kcd-conditional-block > .kc-btn,
  .kcd-standalone-btn{
    display:inline-block;
    margin:6px 0 28px;
  }

  .kcd-nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap; }
  .kcd-nav-spacer{ flex:1; }
  .kcd-nav .kc-btn{ margin:0; }

  /* Suppression des flèches de sélecteur sur les champs numériques */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input[type="number"]{
    -moz-appearance:textfield;
    -webkit-appearance:none;
    appearance:textfield;
  }

  /* Bouton PDF proéminent */
  .kcd-pdf-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:18px 20px; margin:14px 0 16px;
    background:var(--kc-white); border:2px solid var(--kc-violet); border-radius:10px;
    font-family:'Mulish', Arial, sans-serif; font-weight:800; font-size:1rem; color:var(--kc-violet);
    cursor:pointer; transition:background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .kcd-pdf-btn:hover{ background:rgba(141,30,129,0.06); transform:translateY(-1px); box-shadow:0 6px 18px rgba(141,30,129,0.16); }
  .kcd-pdf-btn svg{ flex-shrink:0; }
  .kcd-pdf-caption{ text-align:center; font-size:0.82rem; color:rgba(18,56,89,0.55); margin:6px 0 34px; }

  /* ---------- RESUME SCREEN ---------- */

  .kcd-resume-card{ text-align:center; padding:44px 28px; }
  .kcd-resume-card h1{ font-size:1.6rem; margin-bottom:14px; }
  .kcd-resume-actions{ display:flex; flex-direction:column; gap:12px; margin-top:26px; }

  /* ---------- SUMMARY (Mon Déclic) ---------- */

  .kcd-summary-block{
    background:var(--kc-mist); border-radius:12px; padding:20px 20px; margin-bottom:18px;
  }
  .kcd-summary-label{
    font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.04em; color:rgba(18,56,89,0.6); margin-bottom:8px;
  }
  .kcd-summary-value{
    font-family:'Mulish', Arial, sans-serif; font-weight:800; font-size:1.4rem; color:var(--kc-navy);
  }
  .kcd-summary-value.kcd-accent{
    background:var(--kc-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .kcd-summary-sub{ font-size:0.88rem; color:rgba(18,56,89,0.65); margin-top:6px; line-height:1.4; }

  .kcd-domain-block{ margin-bottom:16px; }
  .kcd-domain-title{
    font-family:'Mulish', Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--kc-violet); margin-bottom:8px;
  }
  .kcd-domain-list{ margin:0; padding-left:20px; }
  .kcd-domain-list li{ font-size:0.92rem; line-height:1.55; color:rgba(18,56,89,0.82); margin-bottom:4px; }

  .kcd-declic-echo{
    text-align:center; padding:26px 10px; margin:26px 0 24px;
    border-top:1px solid var(--kc-line-soft); border-bottom:1px solid var(--kc-line-soft);
  }
  .kcd-declic-echo h2{ font-size:1.5rem; }

  /* ---------- REASSURANCE / CTA ---------- */

  .kcd-cta-box{
    background:var(--kc-navy); border-radius:14px; padding:32px 28px; color:var(--kc-white); margin:8px 0 24px;
  }
  .kcd-cta-box h2{ color:var(--kc-white); font-size:1.5rem; margin-bottom:14px; }
  .kcd-cta-box p{ color:rgba(255,255,255,0.85); margin-bottom:20px; }
  .kcd-cta-box .kc-btn-primary{ display:inline-block; text-decoration:none; }

  .kcd-restart-block{ text-align:center; margin-top:22px; }

  @media (max-width: 560px){
    .kc-header{ padding:16px 18px; flex-wrap:wrap; }
    .kc-progress{ order:3; max-width:none; width:100%; }
    main{ padding:32px 16px 80px; }
    .kcd-screen h1{ font-size:1.6rem; }
    .kcd-inline-fields{ flex-direction:column; gap:20px; }
  }
</style>
</head>
<body>
<div class="kc-app">
  <header class="kc-header">
    <div class="kc-brand">Kif'<span>Cash</span></div>
    <div class="kc-progress" id="kcd-progress" hidden>
      <div class="kc-progress-track"><div class="kc-progress-fill" id="kcd-progress-fill"></div></div>
      <span class="kc-progress-count" id="kcd-progress-count">0 / 0</span>
    </div>
  </header>
  <main id="kcd-main"></main>
</div>

<script>
(function(){

  // ============================================================
  // CONFIGURATION
  // ============================================================

  var STORAGE_KEY = "kifcash_declic_v2";
  var EXPIRATION_MS = 7 * 24 * 60 * 60 * 1000; // 7 jours

  var SCREENS = ["situation", "money", "time", "mentalload", "saboteurs", "summary", "reassurance", "cta"];
  // "intro" est hors tableau, écran 0 avant le parcours principal

  var SABOTEURS = [
    "Sauveteuse Altruiste",
    "Persévérante Insatiable",
    "Serrurière de Fortune",
    "Rebelle Intègre",
    "Prospère Saboteuse"
  ];
  var UNKNOWN_LABEL = "Je ne sais pas";

  var FREQUENCIES = [
    { key: "1x_an",       label: "1 fois par an",             coef: 1 },
    { key: "2_3x_an",      label: "2 à 3 fois par an",          coef: 2.5 },
    { key: "2_3_mois",     label: "Tous les 2 à 3 mois",        coef: 5 },
    { key: "1x_mois",      label: "Environ 1 fois par mois",    coef: 12 },
    { key: "2_3x_mois",    label: "2 à 3 fois par mois",        coef: 30 },
    { key: "1x_semaine",   label: "Environ 1 fois par semaine", coef: 52 },
    { key: "2_3x_semaine", label: "2 à 3 fois par semaine",     coef: 130 }
  ];

  var MONEY_TIME_ANSWERS_MONEY = [
    { key: "estimable", label: "Oui, et je peux l'estimer" },
    { key: "hard",       label: "Oui, mais difficile à chiffrer" },
    { key: "no",         label: "Non / pas directement" },
    { key: "unknown",    label: "Je ne sais pas" }
  ];

  var MONEY_TIME_ANSWERS_TIME = [
    { key: "estimable", label: "Oui, et je peux l'estimer" },
    { key: "hard",       label: "Oui, mais difficile à chiffrer" },
    { key: "no",         label: "Non / pas vraiment" },
    { key: "unknown",    label: "Je ne sais pas" }
  ];

  // Intro affichée au-dessus des champs chiffrés selon la réponse donnée
  var ESTIMATE_INTRO_TEXT = {
    estimable: null,
    hard: "Même si le montant exact est difficile à connaître, donnez une estimation approximative.",
    unknown: "Vous ne savez pas avec certitude. Mais si vous deviez avancer un chiffre, même approximatif, lequel donneriez-vous ? Ce n'est pas grave si ce n'est pas vérifiable."
  };

  var MENTAL_LOAD_OPTIONS = [
    "Aucune",
    "Ça me traverse parfois l'esprit",
    "J'y pense régulièrement",
    "Ça me prend beaucoup de place",
    "C'est constamment dans un coin de ma tête",
    "Je n'en dors plus"
  ];

  // Conséquences : clé, libellé, domaine
  var CONSEQUENCES = [
    { key: "c1",  label: "Je rumine ou j'y pense même quand je voudrais décrocher", domain: "perso" },
    { key: "c2",  label: "J'ai plus de mal à me concentrer sur autre chose", domain: "pro" },
    { key: "c3",  label: "Je repousse certaines décisions", domain: "pro" },
    { key: "c4",  label: "J'ai plus de mal à prendre des décisions simples", domain: "pro" },
    { key: "c5",  label: "Je surveille davantage mes comptes, mes ventes ou mes dépenses", domain: "pro" },
    { key: "c6",  label: "Je travaille plus ou plus longtemps pour compenser", domain: "pro" },
    { key: "c7",  label: "Je reporte du repos, des loisirs ou du temps personnel", domain: "perso" },
    { key: "c8",  label: "Mon sommeil est moins bon", domain: "sante" },
    { key: "c9",  label: "Je me sens plus tendue ou stressée", domain: "sante" },
    { key: "c10", label: "Je me sens plus fatiguée", domain: "sante" },
    { key: "c11", label: "J'ai davantage de tensions physiques, de maux de tête ou le ventre noué", domain: "sante" },
    { key: "c12", label: "Je culpabilise ou je m'en veux", domain: "confiance" },
    { key: "c13", label: "Je doute plus facilement de moi ou de mes capacités", domain: "confiance" },
    { key: "c14", label: "J'ai tendance à me décourager ou à laisser tomber certaines choses", domain: "confiance" },
    { key: "c15", label: "J'évite certaines conversations liées à l'argent", domain: "relations" },
    { key: "c16", label: "Cela crée des tensions dans ma vie personnelle ou familiale", domain: "perso" },
    { key: "c17", label: "Cela crée des tensions dans certaines de mes relations", domain: "relations" },
    { key: "c18", label: "J'évite certaines sorties, dépenses ou activités", domain: "relations" },
    { key: "c19", label: "Je me compare plus souvent aux autres", domain: "relations" },
    { key: "c20", label: "J'essaie de donner le change ou de cacher la situation", domain: "relations" },
    { key: "c21", label: "Je me sens moins disponible ou plus irritable avec les autres", domain: "perso" },
    { key: "c22", label: "Je compense parfois avec des achats, de la nourriture, de l'alcool ou autre chose", domain: "sante" },
    { key: "c23", label: "Cette situation me pousse parfois à prendre des décisions que je regrette ensuite", domain: "pro" }
  ];
  var CONSEQUENCE_OTHER_KEY = "autre";
  var CONSEQUENCE_NONE_KEY = "rien";

  var DOMAINS = [
    { key: "sante",     label: "Votre santé" },
    { key: "pro",        label: "Votre vie professionnelle" },
    { key: "perso",      label: "Votre vie personnelle ou familiale" },
    { key: "relations",  label: "Vos relations" },
    { key: "confiance",  label: "Votre confiance en vous" }
  ];

  var CTA_CONFIG = {
    title: "Vous avez eu le Déclic. Maintenant, vous pouvez aller plus loin.",
    text: "Le Déclic vous a permis d'observer une situation, de mesurer ce qu'elle vous coûte et de voir jusqu'où ses conséquences peuvent déborder. Vous avez aussi commencé à repérer les Saboteurs Financiers qui pourraient intervenir. Kif'Cash, Déjouez vos Saboteurs Financiers vous accompagne pour repérer les mécanismes qui se reproduisent dans votre réalité, intervenir là où ils vous coûtent et les déjouer durablement.",
    buttonLabel: "Poursuivre avec Kif'Cash",
    url: "https://www.chenillepapillon.be/kifcash"
  };

  var DECLIC_URL = "https://www.chenillepapillon.be/saboteurs-financiers-declic";

  function freqByKey(key){
    for (var i = 0; i < FREQUENCIES.length; i++){ if (FREQUENCIES[i].key === key) return FREQUENCIES[i]; }
    return null;
  }
  function consequenceByKey(key){
    for (var i = 0; i < CONSEQUENCES.length; i++){ if (CONSEQUENCES[i].key === key) return CONSEQUENCES[i]; }
    return null;
  }
  function domainByKey(key){
    for (var i = 0; i < DOMAINS.length; i++){ if (DOMAINS[i].key === key) return DOMAINS[i]; }
    return null;
  }

  // ============================================================
  // ÉTAT ET STOCKAGE LOCAL
  // ============================================================

  function emptyState(){
    return {
      version: "2026.2",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      screenIndex: 0, // 0 = intro, 1..8 = SCREENS[0..7]
      situation: { text: "", controlConfirmed: null },
      money: { answer: null, amount: null, frequency: null, annualAmount: null },
      time: { answer: null, hours: null, minutes: null, frequency: null, annualMinutes: null },
      timeValue: { personalValue: null, hourlyRate: null, hourlyRateUnknown: false, annualLow: null, annualHigh: null },
      mentalLoad: null,
      consequences: { selected: [], other: "" },
      saboteurs: []
    };
  }

  var state = null;

  function saveState(){
    state.updatedAt = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function clearDeclicData(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = emptyState();
  }

  function loadSavedState(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
    if (!raw) return null;
    var parsed = null;
    try{ parsed = JSON.parse(raw); }catch(e){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      return null;
    }
    if (!parsed || !parsed.createdAt || !parsed.situation || !parsed.money || !parsed.time){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      return null;
    }
    if (Date.now() - parsed.createdAt > EXPIRATION_MS){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      return null;
    }
    return parsed;
  }

  // ============================================================
  // OUTILS DOM
  // ============================================================

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs){
      if (!attrs.hasOwnProperty(key)) continue;
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function(child){ if (child) node.appendChild(child); });
    return node;
  }
  function txt(str){ return document.createTextNode(str); }

  function formatEuros(n){
    n = Math.round(n || 0);
    return n.toLocaleString("fr-FR") + " €";
  }

  // Affichage courte durée : "45 min", "18 h", "18 h 30"
  function formatDuration(decimalHours){
    decimalHours = decimalHours || 0;
    var totalMinutes = Math.round(decimalHours * 60);
    var h = Math.floor(totalMinutes / 60);
    var m = totalMinutes % 60;
    if (h <= 0) return m + " min";
    if (m === 0) return h + " h";
    return h + " h " + m;
  }

  // Affichage durée annuelle : "104 heures / an"
  function formatAnnualDuration(totalMinutes){
    var hours = Math.round((totalMinutes || 0) / 60);
    return hours.toLocaleString("fr-FR") + " heures / an";
  }

  // ============================================================
  // CALCULS
  // ============================================================

  function computeTimeValueRange(){
    var annualMinutes = state.time.annualMinutes;
    if (!annualMinutes) return { low: null, high: null };
    var annualHours = annualMinutes / 60;
    var values = [];
    if (state.timeValue.personalValue) values.push(state.timeValue.personalValue);
    if (!state.timeValue.hourlyRateUnknown && state.timeValue.hourlyRate) values.push(state.timeValue.hourlyRate);
    if (values.length === 0) return { low: null, high: null };
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    return { low: Math.round(min * annualHours), high: Math.round(max * annualHours) };
  }

  function groupedDomains(){
    var groups = {};
    state.consequences.selected.forEach(function(key){
      var c = consequenceByKey(key);
      if (!c) return;
      if (!groups[c.domain]) groups[c.domain] = [];
      groups[c.domain].push(c.label);
    });
    var result = [];
    DOMAINS.forEach(function(d){
      if (groups[d.key] && groups[d.key].length){
        result.push({ label: d.label, items: groups[d.key] });
      }
    });
    return result;
  }

    if (state.screenIndex <= 0){ bar.hidden = true; return; }

    var pct = (idx / SCREENS.length) * 100;

  function next(){ if (state.screenIndex < SCREENS.length) goToIndex(state.screenIndex + 1); }

  // Construit un item radio/checkbox générique
  function choiceItem(opts){
    // opts: { type: "radio"|"checkbox", name, value, label, checked, onChange }
    var input = el("input", { type: opts.type, name: opts.name || "" });
    input.checked = !!opts.checked;

  function renderMentalLoad(main){
    var screen = el("div", { class: "kcd-screen" });
    screen.appendChild(el("h2", {}, [txt("Et ce n'est pas tout...")]));
    screen.appendChild(situationRecall());

    var qField = el("div", { class: "kcd-field" });
    qField.appendChild(el("label", {}, [txt("Quelle place cette situation prend-elle dans votre esprit ?")]));
    var choiceList = el("div", { class: "kcd-choice-list" });
    var currentLoad = state.mentalLoad;
    var loadRefs = [];
    MENTAL_LOAD_OPTIONS.forEach(function(label){
      var c = choiceItem({
        type: "radio", name: "mental-load", value: label, label: label, checked: currentLoad === label,
        onChange: function(){
          currentLoad = label;
          loadRefs.forEach(function(ref){ ref.item.classList.toggle("selected", ref.value === currentLoad); });
        }
      });
      loadRefs.push({ item: c.item, value: label });
      choiceList.appendChild(c.item);
    });
    qField.appendChild(choiceList);
    screen.appendChild(qField);

    screen.appendChild(el("h3", {}, [txt("Quand cette situation vous pèse, qu'est-ce qu'elle finit aussi par affecter ?")]));
    var consequenceList = el("div", { class: "kcd-choice-list" });
    var selected = state.consequences.selected.slice();
    var otherText = state.consequences.other || "";
    var refs = [];

    var otherField = el("div", { class: "kcd-field", style: "display:none; margin-top:-4px; margin-bottom:18px;" });
    var otherInput = el("input", { type: "text" });
    otherInput.value = otherText;
    otherField.appendChild(otherInput);

    function refreshConsequenceUI(){
      refs.forEach(function(ref){
        var isChecked = selected.indexOf(ref.key) !== -1;
        ref.input.checked = isChecked;
        ref.item.classList.toggle("selected", isChecked);
      });
      otherField.style.display = selected.indexOf(CONSEQUENCE_OTHER_KEY) !== -1 ? "block" : "none";
    }

    function toggleConsequence(key){
      var idx = selected.indexOf(key);
      if (key === CONSEQUENCE_NONE_KEY){
        if (idx === -1){ selected = [CONSEQUENCE_NONE_KEY]; } else { selected = []; }
      } else {
        if (idx === -1){
          selected.push(key);
          var noneIdx = selected.indexOf(CONSEQUENCE_NONE_KEY);
          if (noneIdx !== -1) selected.splice(noneIdx, 1);
        } else {
          selected.splice(idx, 1);
        }
      }
      refreshConsequenceUI();
    }

    CONSEQUENCES.forEach(function(c){
      var checked = selected.indexOf(c.key) !== -1;
      var built = choiceItem({
        type: "checkbox", name: "consequence", label: c.label, checked: checked,
        onChange: function(){ toggleConsequence(c.key); }
      });
      refs.push({ key: c.key, input: built.input, item: built.item });
      consequenceList.appendChild(built.item);
    });

    var otherBuilt = choiceItem({
      type: "checkbox", name: "consequence", label: "Autre", checked: selected.indexOf(CONSEQUENCE_OTHER_KEY) !== -1,
      onChange: function(){ toggleConsequence(CONSEQUENCE_OTHER_KEY); }
    });
    refs.push({ key: CONSEQUENCE_OTHER_KEY, input: otherBuilt.input, item: otherBuilt.item });
    consequenceList.appendChild(otherBuilt.item);
    consequenceList.appendChild(otherField);

    var noneBuilt = choiceItem({
      type: "checkbox", name: "consequence", label: "Rien de tout cela", checked: selected.indexOf(CONSEQUENCE_NONE_KEY) !== -1,
      onChange: function(){ toggleConsequence(CONSEQUENCE_NONE_KEY); }
    });
    refs.push({ key: CONSEQUENCE_NONE_KEY, input: noneBuilt.input, item: noneBuilt.item });
    consequenceList.appendChild(noneBuilt.item);

    refreshConsequenceUI();
    screen.appendChild(consequenceList);

    var errorNote = el("div", { class: "kcd-field-error", style: "display:none; margin-bottom:16px;" }, [txt("Sélectionnez une option pour continuer.")]);
    screen.appendChild(errorNote);

    screen.appendChild(navRow({
      showPrev: true,
      onPrev: prev,
      onNext: function(){
        var valid = true;
        if (!currentLoad) valid = false;
        if (selected.length === 0) valid = false;
        if (!valid){ errorNote.style.display = "block"; return; }
        errorNote.style.display = "none";
        state.mentalLoad = currentLoad;
        state.consequences.selected = selected;
        state.consequences.other = selected.indexOf(CONSEQUENCE_OTHER_KEY) !== -1 ? otherInput.value.trim() : "";
        saveState();
        next();
      }
    }));

    main.appendChild(screen);
  }

  // ============================================================

  function generatePdf(){
    if (!window.jspdf || !window.jspdf.jsPDF){
      alert("Le générateur de PDF n'a pas pu se charger. Vérifiez votre connexion et réessayez.");
      return;
    }

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: "mm", format: "a4" });

    // Couleurs Kif'Cash
    var navy = [18, 56, 89];
    var violet = [141, 30, 129];
    var rose = [230, 15, 114];
    var mist = [245, 245, 242];
    var light = [250, 250, 249];
    var grey = [96, 113, 128];
    var paleGrey = [154, 163, 170];
    var line = [220, 226, 230];
    var white = [255, 255, 255];

    var pageWidth = 210;
    var pageHeight = 297;
    var marginX = 18;
    var contentWidth = pageWidth - marginX * 2;
    var footerY = 282;
    var currentPage = 1;

    function textColor(rgb){ doc.setTextColor(rgb[0], rgb[1], rgb[2]); }
    function fillColor(rgb){ doc.setFillColor(rgb[0], rgb[1], rgb[2]); }
    function drawColor(rgb){ doc.setDrawColor(rgb[0], rgb[1], rgb[2]); }

    function addPage(){
      doc.addPage();
      currentPage += 1;
      drawPageBrand();
    }

    function drawPageBrand(){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      textColor(navy);
      doc.text("Kif'", marginX, 15);
      var prefixW = doc.getTextWidth("Kif'");
      textColor(violet);
      doc.text("Cash", marginX + prefixW, 15);
    }

    function smallLabel(text, x, y, color){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.2);
      textColor(color || violet);
      doc.text(String(text).toUpperCase(), x, y);
    }

    function drawWrappedText(text, x, y, maxWidth, opts){
      opts = opts || {};
      doc.setFont("helvetica", opts.bold ? "bold" : "normal");
      doc.setFontSize(opts.size || 9.5);
      textColor(opts.color || navy);
      var lines = doc.splitTextToSize(String(text || ""), maxWidth);
      var lineHeight = opts.lineHeight || ((opts.size || 9.5) * 0.38 + 1.2);
      doc.text(lines, x, y);
      return { lines: lines, height: lines.length * lineHeight, lineHeight: lineHeight };
    }

    function metricDisplayMoney(){
      if (state.money.answer === "estimable" && state.money.annualAmount !== null){
        return { value: formatEuros(state.money.annualAmount), note: "par an identifiés" };
      }
      if (state.money.answer === "hard" && state.money.annualAmount !== null){
        return { value: formatEuros(state.money.annualAmount), note: "estimation approximative / an" };
      }
      if (state.money.answer === "unknown" && state.money.annualAmount !== null){
        return { value: formatEuros(state.money.annualAmount), note: "estimation incertaine / an" };
      }
      if (state.money.answer === "no"){
        return { value: "Pas d'impact direct", note: "identifié sur cette situation" };
      }
      return { value: "À préciser", note: "pas encore chiffré" };
    }

    function metricDisplayTime(){
      if (state.time.answer === "estimable" && state.time.annualMinutes !== null){
        return { value: formatAnnualDuration(state.time.annualMinutes).replace(" / an", ""), note: "par an absorbées" };
      }
      if (state.time.answer === "hard" && state.time.annualMinutes !== null){
        return { value: formatAnnualDuration(state.time.annualMinutes).replace(" / an", ""), note: "estimation approximative / an" };
      }
      if (state.time.answer === "unknown" && state.time.annualMinutes !== null){
        return { value: formatAnnualDuration(state.time.annualMinutes).replace(" / an", ""), note: "estimation incertaine / an" };
      }
      if (state.time.answer === "no"){
        return { value: "Pas de temps perdu", note: "identifié sur cette situation" };
      }
      return { value: "À préciser", note: "pas encore chiffré" };
    }

    function drawMetricCard(x, y, width, height, label, value, note){
      drawColor(line);
      doc.setLineWidth(0.25);
      doc.rect(x, y, width, height);

      smallLabel(label, x + 5, y + 7, grey);

      var valueSize = value.length > 20 ? 12 : (value.length > 13 ? 15 : 20);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(valueSize);
      textColor(violet);
      var valueLines = doc.splitTextToSize(value, width - 10);
      doc.text(valueLines, x + 5, y + 18);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      textColor(grey);
      var noteLines = doc.splitTextToSize(note, width - 10);
      doc.text(noteLines, x + 5, y + height - 7);
    }

    function mentalLoadIndex(){
      var idx = MENTAL_LOAD_OPTIONS.indexOf(state.mentalLoad);
      return idx >= 0 ? idx + 1 : 0;
    }

    function drawMentalScale(x, y, width){
      var count = MENTAL_LOAD_OPTIONS.length;
      var active = mentalLoadIndex();
      var gap = width / (count - 1);

      drawColor(line);
      doc.setLineWidth(0.6);
      doc.line(x, y, x + width, y);

      for (var i = 0; i < count; i++){
        var cx = x + gap * i;
        if (i < active){
          fillColor(violet);
          drawColor(violet);
        } else {
          fillColor(white);
          drawColor(line);
        }
        doc.circle(cx, y, 1.7, "FD");
      }
    }

    function consequenceGroups(){
      var groups = groupedDomains();
      if (state.consequences.selected.indexOf(CONSEQUENCE_OTHER_KEY) !== -1 && state.consequences.other){
        groups.push({ label: "Autre conséquence identifiée", items: [state.consequences.other] });
      }
      return groups;
    }

    function domainCardHeight(items, width){
      var h = 13;
      items.forEach(function(item){
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.9);
        var lines = doc.splitTextToSize(item, width - 13);
        h += Math.max(4.2, lines.length * 3.5 + 1.2);
      });
      return Math.max(24, h + 3);
    }

    function drawDomainCard(x, y, width, label, items){
      var height = domainCardHeight(items, width);
      fillColor(light);
      doc.rect(x, y, width, height, "F");
      fillColor(violet);
      doc.rect(x, y, width, 1.2, "F");

      smallLabel(label, x + 5, y + 7, violet);
      var cursor = y + 13;

      items.forEach(function(item){
        fillColor(rose);
        doc.circle(x + 5.2, cursor - 1.1, 0.65, "F");
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.9);
        textColor(navy);
        var lines = doc.splitTextToSize(item, width - 13);
        doc.text(lines, x + 8.5, cursor);
        cursor += Math.max(4.2, lines.length * 3.5 + 1.2);
      });
      return height;
    }

    function drawSaboteurBadge(text, x, y){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.6);
      var padX = 4;
      var width = Math.min(75, doc.getTextWidth(text.toUpperCase()) + padX * 2);
      drawColor([195, 157, 191]);
      fillColor([250, 246, 249]);
      doc.roundedRect(x, y, width, 8, 4, 4, "FD");
      textColor(violet);
      doc.text(text.toUpperCase(), x + padX, y + 5.2);
      return width;
    }

    function drawCtaButton(x, y, width, label, url){
      fillColor(rose);
      doc.roundedRect(x, y, width, 11, 2, 2, "F");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.6);
      textColor(white);
      var textWidth = doc.getTextWidth(label);
      doc.text(label, x + (width - textWidth) / 2, y + 7);
      doc.link(x, y, width, 11, { url: url });
    }

    function drawLegalBlock(){
      var y = 267;
      drawColor(line);
      doc.setLineWidth(0.25);
      doc.line(marginX, y, pageWidth - marginX, y);

      doc.setFont("helvetica", "bold");
      doc.setFontSize(6.6);
      textColor(grey);
      doc.text("© Juliette Bodson 2026, Tous droits réservés", marginX, y + 4.5);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(5.8);
      textColor(paleGrey);
      var legal = "Les contenus, exercices, textes et outils de l'expérience Kif'Cash et des Saboteurs Financiers sont protégés par le droit d'auteur. Toute reproduction, adaptation, diffusion ou utilisation, totale ou partielle, sans autorisation écrite préalable est interdite. Ce document est réservé à votre usage personnel.";
      var legalLines = doc.splitTextToSize(legal, contentWidth);
      doc.text(legalLines, marginX, y + 8);

      var warning = "Les résultats et montants présentés sont des estimations calculées à partir des informations que vous avez renseignées. Ils ont une vocation pédagogique et ne constituent ni une analyse comptable, ni un conseil financier, fiscal ou en investissement. Toute décision financière reste sous votre responsabilité et peut nécessiter l'avis d'un professionnel qualifié.";
      var warningLines = doc.splitTextToSize(warning, contentWidth);
      doc.text(warningLines, marginX, y + 8 + legalLines.length * 2.4);
    }

    function addPageNumbers(){
      var total = doc.getNumberOfPages();
      for (var i = 1; i <= total; i++){
        doc.setPage(i);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.8);
        textColor(paleGrey);
        doc.text("Kif'Cash · Mon Déclic · " + i + " / " + total, pageWidth - marginX, footerY, { align: "right" });
      }
    }

    // ============================================================
    // PAGE 1 : LA PRISE DE CONSCIENCE
    // ============================================================

    drawPageBrand();

    smallLabel("Votre bilan personnel", marginX, 30, rose);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(29);
    textColor(navy);
    doc.text("Mon Déclic", marginX, 43);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    textColor(grey);
    doc.text("Une situation, son coût concret et tout ce qu'elle mobilise autour d'elle.", marginX, 51);

    // Situation
    var situationY = 62;
    var situationLines = doc.splitTextToSize("« " + state.situation.text + " »", contentWidth - 14);
    var situationHeight = Math.max(31, 18 + situationLines.length * 5.3);
    fillColor(mist);
    doc.rect(marginX, situationY, contentWidth, situationHeight, "F");
    fillColor(violet);
    doc.rect(marginX, situationY, 2, situationHeight, "F");
    smallLabel("La situation que j'ai regardée", marginX + 7, situationY + 8, violet);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11.5);
    textColor(navy);
    doc.text(situationLines, marginX + 7, situationY + 18);

    // Trois indicateurs
    var metricsY = situationY + situationHeight + 8;
    var gap = 4;
    var cardWidth = (contentWidth - gap * 2) / 3;
    var cardHeight = 36;
    var moneyMetric = metricDisplayMoney();
    var timeMetric = metricDisplayTime();
    var mentalValue = state.mentalLoad || "À préciser";

    drawMetricCard(marginX, metricsY, cardWidth, cardHeight, "Argent", moneyMetric.value, moneyMetric.note);
    drawMetricCard(marginX + cardWidth + gap, metricsY, cardWidth, cardHeight, "Temps", timeMetric.value, timeMetric.note);
    drawMetricCard(marginX + (cardWidth + gap) * 2, metricsY, cardWidth, cardHeight, "Place dans ma tête", mentalValue, "réponse déclarée");

    // Valeur du temps
    var timeBoxY = metricsY + cardHeight + 8;
    var timeBoxHeight = 54;
    fillColor(navy);
    doc.rect(marginX, timeBoxY, contentWidth, timeBoxHeight, "F");
    smallLabel("Ce temps a aussi une valeur", marginX + 7, timeBoxY + 9, [203, 211, 218]);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.8);
    textColor([210, 220, 227]);
    doc.text("Votre repère personnel", marginX + 7, timeBoxY + 19);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    textColor(white);
    doc.text(formatEuros(state.timeValue.personalValue) + " / h", marginX + 7, timeBoxY + 27);

    if (!state.timeValue.hourlyRateUnknown && state.timeValue.hourlyRate){
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.8);
      textColor([210, 220, 227]);
      doc.text("Votre tarif horaire moyen", marginX + 7, timeBoxY + 37);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      textColor(white);
      doc.text(formatEuros(state.timeValue.hourlyRate) + " / h", marginX + 7, timeBoxY + 45);
    }

    var valueX = marginX + 74;
    var valueW = contentWidth - 81;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    textColor([210, 220, 227]);
    doc.text("Ordre de grandeur de la valeur du temps mobilisé", valueX, timeBoxY + 19);

    var valueRangeText = "Pas d'équivalent calculable";
    if (state.timeValue.annualLow !== null && state.timeValue.annualHigh !== null){
      valueRangeText = state.timeValue.annualLow === state.timeValue.annualHigh
        ? formatEuros(state.timeValue.annualLow) + " / an"
        : formatEuros(state.timeValue.annualLow) + " à " + formatEuros(state.timeValue.annualHigh) + " / an";
    }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(valueRangeText.length > 28 ? 15 : 18);
    textColor(white);
    var valueLines = doc.splitTextToSize(valueRangeText, valueW);
    doc.text(valueLines, valueX, timeBoxY + 29);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(6.8);
    textColor([190, 202, 211]);
    var disclaimer = doc.splitTextToSize("Cette mise en perspective ne correspond pas nécessairement à une perte de chiffre d'affaires.", valueW);
    doc.text(disclaimer, valueX, timeBoxY + 43);

    // Premier aperçu des conséquences
    var domains = consequenceGroups();
    var previewY = timeBoxY + timeBoxHeight + 11;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11.5);
    textColor(navy);
    doc.text("Cette situation déborde aussi ailleurs", marginX, previewY);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.6);
    textColor(grey);
    var domainNames = domains.length ? domains.map(function(d){ return d.label; }).join(" · ") : "Aucune conséquence supplémentaire identifiée.";
    var domainLines = doc.splitTextToSize(domainNames, contentWidth);
    doc.text(domainLines, marginX, previewY + 7);

    // ============================================================
    // PAGE 2 : PROPAGATION, SABOTEURS ET BASCULE
    // ============================================================

    addPage();
    var y = 30;

    smallLabel("Charge mentale", marginX, y, violet);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    textColor(navy);
    doc.text("La place que cette situation occupe", marginX, y + 9);

    var mentalX = 128;
    var mentalW = pageWidth - marginX - mentalX;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    textColor(violet);
    var mentalLines = doc.splitTextToSize(state.mentalLoad || "À préciser", mentalW);
    doc.text(mentalLines, pageWidth - marginX, y + 3, { align: "right" });
    drawMentalScale(mentalX, y + 14, mentalW - 3);

    drawColor(line);
    doc.setLineWidth(0.25);
    doc.line(marginX, y + 23, pageWidth - marginX, y + 23);
    y += 33;

    // Cartes des domaines touchés
    if (domains.length > 0){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      textColor(navy);
      doc.text("Ce que cette situation finit aussi par affecter", marginX, y);
      y += 8;

      var colGap = 5;
      var colWidth = (contentWidth - colGap) / 2;
      var colY = [y, y];

      domains.forEach(function(domain){
        var targetCol = colY[0] <= colY[1] ? 0 : 1;
        var x = marginX + targetCol * (colWidth + colGap);
        var needed = domainCardHeight(domain.items, colWidth);

        if (colY[targetCol] + needed > 190){
          // Si la matière est exceptionnellement longue, on ajoute une page propre plutôt que de tasser.
          addPage();
          y = 30;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(12);
          textColor(navy);
          doc.text("Les répercussions que vous avez identifiées", marginX, y);
          y += 9;
          colY = [y, y];
          targetCol = 0;
          x = marginX;
        }

        var h = drawDomainCard(x, colY[targetCol], colWidth, domain.label, domain.items);
        colY[targetCol] += h + 5;
      });

      y = Math.max(colY[0], colY[1]) + 4;
    } else {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      textColor(grey);
      doc.text("Aucune conséquence supplémentaire n'a été identifiée dans cette situation.", marginX, y);
      y += 12;
    }

    // Si les conséquences ont forcé une page supplémentaire, on garde la suite sur la page courante.
    if (y > 205){
      addPage();
      y = 30;
    }

    // Saboteurs potentiellement impliqués
    smallLabel("Saboteurs potentiellement impliqués", marginX, y, violet);
    y += 6;

    if (state.saboteurs.indexOf(UNKNOWN_LABEL) !== -1){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      textColor(navy);
      doc.text("Je ne sais pas encore.", marginX, y + 5);
      y += 15;
    } else {
      var badgeX = marginX;
      var badgeY = y;
      state.saboteurs.forEach(function(name){
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.6);
        var badgeWidth = Math.min(75, doc.getTextWidth(name.toUpperCase()) + 8);
        if (badgeX + badgeWidth > pageWidth - marginX){
          badgeX = marginX;
          badgeY += 11;
        }
        drawSaboteurBadge(name, badgeX, badgeY);
        badgeX += badgeWidth + 4;
      });
      y = badgeY + 15;
    }

    // Phrase de bascule
    var climaxHeight = 43;
    if (y + climaxHeight + 62 > 260){
      addPage();
      y = 30;
    }

    y += 4;
    drawColor(line);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    textColor(navy);
    var echo = doc.splitTextToSize("Et nous n'avons regardé qu'une seule situation.", contentWidth - 24);
    doc.text(echo, pageWidth / 2, y, { align: "center" });
    y += echo.length * 7 + 5;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.8);
    textColor(grey);
    var echoSub = doc.splitTextToSize("Ce Déclic montre ce qu'un comportement peut déjà mobiliser quand on prend le temps de regarder au-delà du seul montant visible.", contentWidth - 28);
    doc.text(echoSub, pageWidth / 2, y, { align: "center" });
    y += echoSub.length * 4 + 13;

    drawColor(line);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 11;

    // Bloc de continuité Kif'Cash
    var ctaHeight = 49;
    if (y + ctaHeight > 256){
      addPage();
      y = 30;
    }

    fillColor(navy);
    doc.rect(marginX, y, contentWidth, ctaHeight, "F");
    smallLabel("Pour aller plus loin", marginX + 7, y + 9, [198, 209, 217]);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    textColor(white);
    doc.text("Kif'Cash", marginX + 7, y + 19);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.3);
    textColor([218, 225, 231]);
    var ctaCopy = doc.splitTextToSize("Déjouez vos Saboteurs Financiers pour repérer les mécanismes qui se reproduisent dans votre réalité, comprendre ce qui les entretient et commencer à agir autrement.", 107);
    doc.text(ctaCopy, marginX + 7, y + 27);

    drawCtaButton(pageWidth - marginX - 48, y + 20, 41, "Poursuivre avec Kif'Cash", CTA_CONFIG.url);
    y += ctaHeight + 8;

    // Liens secondaires et contact
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.8);
    textColor(grey);
    doc.textWithLink("Refaire Le Déclic", marginX, y, { url: DECLIC_URL });
    doc.textWithLink("chenillepapillon.be", marginX + 38, y, { url: "https://www.chenillepapillon.be" });
    doc.textWithLink("juliette@chenillepapillon.be", pageWidth - marginX, y, { url: "mailto:juliette@chenillepapillon.be", align: "right" });

    drawLegalBlock();
    addPageNumbers();

    doc.save("mon-declic.pdf");
  }
  // ============================================================
  // ROUTEUR
  // ============================================================

  var resumeMode = false;

  function render(){
    var main = document.getElementById("kcd-main");
    main.innerHTML = "";

    if (resumeMode){
      document.getElementById("kcd-progress").hidden = true;
      renderResume(main);
      return;
    }

    updateProgress();
    var screenId = currentScreenId();
    if (screenId === "intro") renderIntro(main);
    else if (screenId === "situation") renderSituation(main);
    else if (screenId === "money") renderMoney(main);
    else if (screenId === "time") renderTime(main);
    else if (screenId === "mentalload") renderMentalLoad(main);
    else if (screenId === "saboteurs") renderSaboteurs(main);
    else if (screenId === "summary") renderSummary(main);
    else if (screenId === "reassurance") renderReassurance(main);
    else if (screenId === "cta") renderCta(main);

    window.scrollTo(0, 0);
  }

  // ============================================================
  // INITIALISATION
  // ============================================================

  var saved = loadSavedState();
  if (saved){ state = saved; resumeMode = true; }
  else { state = emptyState(); resumeMode = false; }

  render();

})();
</script>
</body>
</html>
