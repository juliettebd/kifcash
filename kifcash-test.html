<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kif'Cash — Test des Saboteurs Financiers©</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kc-violet:#8D1E81;
    --kc-rose:#E60F72;
    --kc-navy:#123859;
    --kc-white:#FFFFFF;
    --kc-mist:#F5F5F2;
    --kc-line: rgba(18,56,89,0.14);
    --kc-line-soft: rgba(18,56,89,0.08);
    --kc-gradient: linear-gradient(90deg, var(--kc-violet), var(--kc-rose));
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--kc-white);
    color:var(--kc-navy);
    font-family:'Roboto', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.kc-display{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }

  .kc-app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HEADER ---------- */

  .kc-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:22px 28px;
    border-bottom:1px solid var(--kc-line-soft);
  }

  .kc-brand{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.05rem;
    color:var(--kc-navy);
  }

  .kc-brand span{
    background:var(--kc-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .kc-progress{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    max-width:340px;
  }

  .kc-progress-track{
    position:relative;
    flex:1;
    height:4px;
    background:var(--kc-line-soft);
    border-radius:2px;
    overflow:hidden;
  }

  .kc-progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:var(--kc-gradient);
    transition:width 0.35s ease;
  }

  .kc-progress-count{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:var(--kc-navy);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- MAIN LAYOUT ---------- */

  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:48px 24px 96px;
  }

  .kc-screen{
    width:100%;
    max-width:620px;
  }

  /* ---------- CAPTURE SCREEN ---------- */

  .kc-intro-eyebrow{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--kc-rose);
    margin-bottom:14px;
  }

  .kc-intro h1{
    font-size:2rem;
    line-height:1.15;
    margin-bottom:18px;
  }

  .kc-intro p{
    font-size:1.02rem;
    line-height:1.65;
    color:rgba(18,56,89,0.82);
    margin:0 0 12px;
  }

  .kc-intro-meta{
    display:flex;
    gap:20px;
    margin:26px 0 36px;
    padding:16px 0;
    border-top:1px solid var(--kc-line-soft);
    border-bottom:1px solid var(--kc-line-soft);
  }

  .kc-meta-item{
    font-size:0.88rem;
    color:rgba(18,56,89,0.75);
  }

  .kc-meta-item strong{
    display:block;
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.15rem;
    color:var(--kc-navy);
  }

  form.kc-form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .kc-field label{
    display:block;
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    margin-bottom:7px;
    color:var(--kc-navy);
  }

  .kc-field input[type="text"],
  .kc-field input[type="email"]{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--kc-line);
    border-radius:8px;
    font-family:'Roboto', Arial, sans-serif;
    font-size:1rem;
    color:var(--kc-navy);
    background:var(--kc-white);
    transition:border-color 0.2s ease;
  }

  .kc-field input:focus{
    outline:none;
    border-color:var(--kc-violet);
  }

  .kc-field-error{
    display:none;
    font-size:0.8rem;
    color:var(--kc-rose);
    margin-top:6px;
  }

  .kc-field.kc-invalid input{
    border-color:var(--kc-rose);
  }

  .kc-field.kc-invalid .kc-field-error{
    display:block;
  }

  .kc-consent{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:16px;
    background:var(--kc-mist);
    border-radius:8px;
    margin-top:6px;
  }

  .kc-consent input{
    margin-top:3px;
    width:17px;
    height:17px;
    accent-color:var(--kc-violet);
    flex-shrink:0;
  }

  .kc-consent label{
    font-size:0.88rem;
    line-height:1.5;
    color:rgba(18,56,89,0.85);
  }

  /* ---------- BUTTONS ---------- */

  .kc-btn{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    border:none;
    border-radius:8px;
    padding:15px 30px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    display:inline-block;
    text-decoration:none;
    text-align:center;
  }

  .kc-btn-primary{
    background:var(--kc-gradient);
    color:var(--kc-white);
  }

  .kc-btn-primary:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(141,30,129,0.28);
  }

  .kc-btn-primary:disabled{
    opacity:0.38;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  .kc-btn-secondary{
    background:transparent;
    color:var(--kc-navy);
    border:1px solid var(--kc-line);
  }

  .kc-btn-secondary:hover{
    border-color:var(--kc-navy);
  }

  .kc-form-submit{
    margin-top:8px;
  }

  /* ---------- QUIZ SCREEN ---------- */

  .kc-quiz-head{
    margin-bottom:8px;
  }

  .kc-quiz-head h2{
    font-size:1.3rem;
    margin-bottom:6px;
  }

  .kc-quiz-head p{
    font-size:0.92rem;
    color:rgba(18,56,89,0.68);
    margin:0;
  }

  .kc-error-banner{
    display:none;
    align-items:center;
    gap:10px;
    background:rgba(230,15,114,0.08);
    border:1px solid rgba(230,15,114,0.3);
    color:var(--kc-rose);
    border-radius:8px;
    padding:13px 16px;
    font-size:0.88rem;
    margin:18px 0;
  }

  .kc-error-banner.show{ display:flex; }

  .kc-question{
    padding:26px 0;
    border-bottom:1px solid var(--kc-line-soft);
  }

  .kc-question:first-of-type{
    border-top:1px solid var(--kc-line-soft);
  }

  .kc-question-text{
    font-size:1.02rem;
    line-height:1.55;
    color:var(--kc-navy);
    margin-bottom:16px;
  }

  .kc-likert{
    display:flex;
    gap:8px;
  }

  .kc-likert button{
    flex:1;
    min-height:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border:1px solid var(--kc-line);
    background:var(--kc-white);
    border-radius:7px;
    padding:8px 4px;
    cursor:pointer;
    transition:all 0.15s ease;
  }

  .kc-likert-num{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1rem;
    color:rgba(18,56,89,0.55);
  }

  .kc-likert-label{
    font-family:'Roboto', Arial, sans-serif;
    font-weight:400;
    font-size:0.72rem;
    line-height:1.2;
    text-align:center;
    color:rgba(18,56,89,0.55);
  }

  .kc-likert button:hover{
    border-color:var(--kc-violet);
  }

  .kc-likert button:hover .kc-likert-num,
  .kc-likert button:hover .kc-likert-label{
    color:var(--kc-violet);
  }

  .kc-likert button.selected{
    background:var(--kc-gradient);
    border-color:transparent;
  }

  .kc-likert button.selected .kc-likert-num,
  .kc-likert button.selected .kc-likert-label{
    color:var(--kc-white);
  }

  @media (max-width: 560px){
    .kc-likert{ flex-direction:column; gap:8px; }
    .kc-likert button{ flex-direction:row; justify-content:flex-start; min-height:48px; padding:10px 14px; gap:12px; }
    .kc-likert-label{ text-align:left; font-size:0.85rem; }
  }

  .kc-quiz-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:32px;
  }

  .kc-quiz-nav-spacer{ flex:1; }

  /* ---------- RESULTS SCREEN ---------- */

  .kc-results h1{
    font-size:1.7rem;
    margin-bottom:12px;
  }

  .kc-results-intro{
    font-size:1.02rem;
    line-height:1.6;
    color:rgba(18,56,89,0.82);
    margin:0 0 30px;
  }

  .kc-results-intro strong{
    color:var(--kc-violet);
  }

  .kc-ranking-list{
    display:flex;
    flex-direction:column;
  }

  .kc-ranking-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 4px;
    border-bottom:1px solid var(--kc-line-soft);
  }

  .kc-ranking-item:first-child{
    border-top:1px solid var(--kc-line-soft);
  }

  .kc-ranking-rank{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:0.85rem;
    color:rgba(18,56,89,0.4);
    width:28px;
    flex-shrink:0;
  }

  .kc-ranking-name{
    flex:1;
    font-size:1rem;
    color:var(--kc-navy);
    font-weight:500;
  }

  .kc-ranking-score{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.92rem;
    color:var(--kc-navy);
    font-variant-numeric:tabular-nums;
  }

  .kc-send-status{
    margin-top:28px;
    font-size:0.85rem;
    line-height:1.5;
  }

  .kc-send-status-pending{ color:rgba(18,56,89,0.55); }
  .kc-send-status-success{ color:rgba(18,56,89,0.55); }
  .kc-send-status-error{ color:var(--kc-rose); }
  .kc-send-status-info{ color:rgba(18,56,89,0.55); }

  /* ---------- SABOTEUR ACCORDIONS ---------- */

  .kc-saboteurs-intro{
    margin-top:44px;
  }

  .kc-saboteurs-intro h2{
    font-size:1.25rem;
    margin-bottom:12px;
  }

  .kc-saboteurs-intro p{
    font-size:0.95rem;
    line-height:1.6;
    color:rgba(18,56,89,0.78);
    margin:0 0 8px;
  }

  .kc-accordion{
    margin-top:20px;
  }

  .kc-accordion-item{
    border:1px solid var(--kc-line);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }

  .kc-accordion-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    background:var(--kc-white);
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--kc-navy);
  }

  .kc-accordion-header:hover{
    background:var(--kc-mist);
  }

  .kc-accordion-chevron{
    flex-shrink:0;
    width:18px; height:18px;
    transition:transform 0.2s ease;
    color:var(--kc-violet);
  }

  .kc-accordion-item.open .kc-accordion-chevron{
    transform:rotate(180deg);
  }

  .kc-accordion-body{
    display:none;
    padding:4px 18px 20px;
    border-top:1px solid var(--kc-line-soft);
  }

  .kc-accordion-item.open .kc-accordion-body{
    display:block;
  }

  .kc-accordion-body p{
    font-size:0.92rem;
    line-height:1.6;
    color:rgba(18,56,89,0.8);
    margin:14px 0 0;
  }

  .kc-accordion-priority{
    font-weight:500;
  }

  .kc-accordion-devise{
    font-style:italic;
    color:var(--kc-violet);
  }

  /* ---------- DÉCLIC CTA ---------- */

  .kc-declic-block{
    margin-top:40px;
    padding-top:32px;
    border-top:1px solid var(--kc-line-soft);
  }

  .kc-declic-block h2{
    font-size:1.15rem;
    margin-bottom:10px;
  }

  .kc-declic-block p{
    font-size:0.95rem;
    line-height:1.6;
    color:rgba(18,56,89,0.78);
    margin:0 0 20px;
  }

  @media (max-width: 560px){
    .kc-header{ padding:16px 18px; flex-wrap:wrap; }
    .kc-progress{ order:3; max-width:none; width:100%; }
    main{ padding:32px 16px 80px; }
    .kc-intro h1{ font-size:1.6rem; }
  }
</style>
</head>

  function scrollToTopEverywhere(){
    window.scrollTo({ top: 0, behavior: "smooth" });
    // Quand la page tourne dans une iframe (intégration SIO), scroller
    // l'intérieur de l'iframe ne fait rien voir côté page hôte : on
    // prévient la page parente pour qu'elle scrolle, elle, jusqu'en
    // haut de l'iframe. Le script d'écoute correspondant vit dans le
    // bloc HTML SIO qui contient l'iframe (voir documentation).
    try {
      window.parent.postMessage({ source: "kifcash", type: "scrollTop" }, "*");
    } catch (e) { /* pas d'iframe parente, ou origine bloquée : sans effet */ }
  }

  function notifyParentResize(){
    try {
      window.parent.postMessage({
        source: "kifcash",
        type: "resize",
        height: document.documentElement.scrollHeight
      }, "*");
    } catch (e) { /* pas d'iframe parente : sans effet */ }
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function chunk(arr, size){
    var out = [];
    for (var i = 0; i < arr.length; i += size){
      out.push(arr.slice(i, i + size));
    }
    return out;
  }

  function answeredCount(){
    return Object.keys(state.answers).length;

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs){
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function(child){
      if (child) node.appendChild(child);
    });
    return node;
  }

  function computeResults(){
    var scores = {
      "Sauveteuse Altruiste": 0,
      "Persévérante Insatiable": 0,
      "Serrurière de Fortune": 0,
      "Rebelle Intègre": 0,
      "Prospère Saboteuse": 0
    };

    var responses = QUESTIONS.map(function(q){
      var answer = state.answers[q.id];
      scores[q.saboteur] += answer;
      return { questionId: q.id, saboteur: q.saboteur, facette: q.facette, answer: answer };
    });

    var ranking = Object.keys(scores)
      .map(function(name){ return { name: name, score: scores[name] }; })
      .sort(function(a, b){
        if (b.score !== a.score) return b.score - a.score;
        return a.name.localeCompare(b.name);
      });

    return {
      scores: scores,
      ranking: ranking,
      dominant: ranking[0],
      secondaire: ranking[1],
      responses: responses
    };
  }

  // ============================================================
  // SOUMISSION
  // ============================================================

  function submitTest(){
    if (state.submitting) return;
    state.submitting = true;

    var results = computeResults();
    state.results = results;

    // Les résultats calculés sont affichés tout de suite : l'envoi
    // au serveur se fait en parallèle et ne conditionne jamais leur
    // affichage. En cas d'échec, seul le petit statut en bas d'écran
    // change, rien n'est perdu ni masqué pour la personne.
    state.screen = "results";
    render();
    scrollToTopEverywhere();

    sendResultsToBackend(results);
  }

  function sendResultsToBackend(results){
    var payload = {
      testVersion: TEST_VERSION,
      participant: state.participant,
      scores: results.scores,
      ranking: results.ranking,
      dominant: results.dominant,
      secondaire: results.secondaire,
      responses: results.responses
    };

    if (!APPS_SCRIPT_URL){
      console.log("[Kif'Cash] APPS_SCRIPT_URL non configurée. Payload calculé :", payload);
      state.submitting = false;
      setSendStatus("info", "Apps Script non connecté pour l'instant : résultats journalisés dans la console.");
      return;
    }

    setSendStatus("pending", "Envoi de vos résultats par email en cours…");

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(function(response){
        if (!response.ok) throw new Error("Réponse serveur non OK");
        return response.json();
      })
      .then(function(data){
        state.submitting = false;
        if (data && data.ok === false) throw new Error(data.error || "Erreur serveur");
        setSendStatus("success", "Vos résultats vous ont aussi été envoyés par email.");
      })
      .catch(function(err){
        console.error("[Kif'Cash] Échec de l'envoi :", err);
        state.submitting = false;
        setSendStatus("error", "L'envoi automatique a rencontré un problème, mais vos résultats restent affichés ci-dessus.");
      });
  }

  function setSendStatus(type, text){
    var statusEl = document.getElementById("kc-send-status");
    if (!statusEl) return;
    statusEl.className = "kc-send-status kc-send-status-" + type;
    statusEl.textContent = text;
  }

    main.innerHTML = "";

    var results = state.results;
    var screen = el("div", { class: "kc-screen kc-results" });

    screen.appendChild(el("div", { class: "kc-intro-eyebrow" }, [document.createTextNode("Vos résultats")]));
    screen.appendChild(el("h1", {}, [document.createTextNode("Merci, " + state.participant.prenom + " !")]));
    screen.appendChild(el("p", { class: "kc-results-intro" }, [
      document.createTextNode("Votre Saboteur Financier principal est "),
      el("strong", {}, [document.createTextNode(results.dominant.name)]),
      document.createTextNode(".")
    ]));

    var list = el("div", { class: "kc-ranking-list" });
    results.ranking.forEach(function(item, index){
      list.appendChild(el("div", { class: "kc-ranking-item" }, [
        el("span", { class: "kc-ranking-rank" }, [document.createTextNode("#" + (index + 1))]),
        el("span", { class: "kc-ranking-name" }, [document.createTextNode(item.name)]),
        el("span", { class: "kc-ranking-score" }, [document.createTextNode(String(item.score))])
      ]));
    });
    screen.appendChild(list);

    var statusEl = state.debugMode
      ? el("div", { class: "kc-send-status kc-send-status-info", id: "kc-send-status" }, [
          document.createTextNode("Mode debug : données fictives, aucun envoi n'a été effectué.")
        ])
      : el("div", { class: "kc-send-status kc-send-status-pending", id: "kc-send-status" }, [
          document.createTextNode("Envoi de vos résultats par email en cours…")
        ]);
    screen.appendChild(statusEl);

    // ---------- Présentation des 5 Saboteurs (accordéons) ----------

    var saboteursIntro = el("div", { class: "kc-saboteurs-intro" }, [
      el("h2", {}, [document.createTextNode("Faites connaissance avec vos Saboteurs")]),
      el("p", {}, [document.createTextNode("Votre classement vous donne une première indication, mais votre Saboteur principal ne raconte pas toute l'histoire. Plusieurs peuvent intervenir dans vos décisions et vos comportements, parfois de façon très différente selon les situations.")]),
      el("p", {}, [document.createTextNode("Commencez par découvrir ce qui caractérise chacun d'eux.")])
    ]);
    screen.appendChild(saboteursIntro);

    var accordion = el("div", { class: "kc-accordion" });

    results.ranking.forEach(function(item, index){
      var desc = SABOTEUR_DESCRIPTIONS[item.name];
      var itemEl = el("div", { class: "kc-accordion-item" });

      var headerLabel = (index + 1) + ". " + item.name + ", " + item.score + " points";
      var chevron = el("svg", { class: "kc-accordion-chevron", viewBox: "0 0 24 24", fill: "none", xmlns: "http://www.w3.org/2000/svg", html: '<path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' });

      var header = el("button", { type: "button", class: "kc-accordion-header" }, [
        el("span", {}, [document.createTextNode(headerLabel)]),
        chevron
      ]);
      header.addEventListener("click", function(){
        itemEl.classList.toggle("open");
      });

      var body = el("div", { class: "kc-accordion-body" });
      if (desc){
        desc.paragraphs.forEach(function(paragraph){
          body.appendChild(el("p", {}, [document.createTextNode(paragraph)]));
        });
        body.appendChild(el("p", { class: "kc-accordion-priority" }, [document.createTextNode(desc.priority)]));
        body.appendChild(el("p", { class: "kc-accordion-devise" }, [document.createTextNode("Sa devise : " + desc.devise)]));
      }

      itemEl.appendChild(header);
      itemEl.appendChild(body);
      accordion.appendChild(itemEl);
    });

    screen.appendChild(accordion);

    // ---------- Bloc Déclic ----------

    var declicBlock = el("div", { class: "kc-declic-block" }, [
      el("h2", {}, [document.createTextNode("Et dans votre business, concrètement ?")]),
      el("p", {}, [document.createTextNode("Vous savez maintenant quels Saboteurs sont les plus présents chez vous.")]),
      el("p", {}, [
        document.createTextNode("Le Déclic vous permet de partir de trois de vos propres comportements et d'observer ce qu'ils vous coûtent en argent, en temps et en encombrement mental. C'est gratuit et ludique.")
      ])
    ]);

    var declicBtn = el("a", { href: DECLIC_URL, class: "kc-btn kc-btn-primary" }, [document.createTextNode("Faire mon Déclic")]);
    declicBlock.appendChild(declicBtn);
    screen.appendChild(declicBlock);

    main.appendChild(screen);
  }

  // ============================================================
  // ROUTER
  // ============================================================

  function render(){
    updateProgressBar();
    if (state.screen === "capture") renderCapture();
    else if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "results") renderResults();

    notifyParentResize();
    // Rattrapage : les polices web (Mulish/Roboto) peuvent finir de
    // charger après le rendu et changer légèrement la hauteur réelle.
    setTimeout(notifyParentResize, 200);
  }

  window.addEventListener("resize", notifyParentResize);

  render();

})();
</script>
</body>
</html>
